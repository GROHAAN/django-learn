{% extends 'base.html' %}
{% block title %}
    <title> Registration Page</title>

{% endblock title %}


{% block css %}
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
{% endblock css %}
    


{% block content %}
    <div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header text-center bg-primary text-white">
                    <h4>Registration Form</h4>
                </div>
                <div class="card-body">

                    <form action="{% url 'register.html'%}" method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <!-- Name -->
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" name="name" class="form-control" placeholder="Enter your name">
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" placeholder="Enter your email">
                        </div>

                        <!-- Contact -->
                        <div class="mb-3">
                            <label class="form-label">Contact Number</label>
                            <input type="tel" name="number" class="form-control" placeholder="Enter contact number">
                        </div>

                        <!-- Gender (Radio) -->
                        <div class="mb-3">
                            <label class="form-label">Gender</label><br>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender">
                                <label class="form-check-label">Male</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender">
                                <label class="form-check-label">Female</label>
                            </div>
                        </div>

                        <!-- Qualification (Checkbox) -->
                        <div class="mb-3">
                            <label class="form-label">Qualification</label><br>
                            <div class="form-check" >
                                <input class="form-check-input" name="qualification" type="checkbox" >
                                <label class="form-check-label">10th</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" name="qualification" type="checkbox">
                                <label class="form-check-label">12th</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" name="qualification" type="checkbox">
                                <label class="form-check-label">Graduation</label>
                            </div>
                        </div>

                        <!-- State (Dropdown) -->
                        <div class="mb-3">
                            <label class="form-label" name="State">State</label>
                            <select class="form-select">
                                <option selected>Select State</option>
                                <option>Uttar Pradesh</option>
                                <option>Maharashtra</option>
                                <option>Delhi</option>
                                <option>Gujarat</option>
                            </select>
                        </div>

                        <!-- Image -->
                        <div class="mb-3">
                            <label class="form-label">Upload Image</label>
                            <input type="file" name="image" class="form-control">
                        </div>

                        <!-- Video -->
                        <div class="mb-3">
                            <label class="form-label">Upload Video</label>
                            <input type="file" name="video" class="form-control">
                        </div>

                        <!-- Audio -->
                        <div class="mb-3">
                            <label class="form-label">Upload Audio</label>
                            <input type="file" name="auido" class="form-control">
                        </div>

                        <!-- Resume -->
                        <div class="mb-3">
                            <label class="form-label">Upload Resume</label>
                            <input type="file" name="resume" class="form-control">
                        </div>

                        <!-- Submit -->
                        <div class="text-center">
                            <button type="submit" class="btn btn-success px-5">
                                Register
                            </button>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
