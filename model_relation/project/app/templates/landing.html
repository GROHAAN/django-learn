<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Landing Page</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #43cea2, #185a9d);
            min-height: 100vh;
        }
        .card {
            border-radius: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }
        .btn-custom {
            border-radius: 30px;
            padding: 12px 35px;
            font-size: 18px;
            font-weight: 600;
        }
        a {
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="row w-100 justify-content-center">

        <div class="col-md-5 col-lg-4 mb-4">
            <div class="card shadow-lg text-center p-4">
                <div class="card-body">
                    <i class="bi bi-credit-card-2-front-fill text-primary" style="font-size: 50px;"></i>
                    <h4 class="mt-3">Aadhar Section</h4>
                    <p class="text-muted">
                        Add and manage Aadhar details securely.
                    </p>
                    <a href="{% url 'aadhar' %}" class="btn btn-primary btn-custom mt-3">
                        Go to Aadhar
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-5 col-lg-4 mb-4">
            <div class="card shadow-lg text-center p-4">
                <div class="card-body">
                    <i class="bi bi-person-plus-fill text-success" style="font-size: 50px;"></i>
                    <h4 class="mt-3">Student Registration</h4>
                    <p class="text-muted">
                        Register new students easily.
                    </p>
                    <a href="{% url 'student' %}" class="btn btn-success btn-custom mt-3">
                        Register Student
                    </a>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
