<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #74ebd5, #9face6);
            min-height: 100vh;
        }
        .card {
            border-radius: 15px;
        }
        .form-control, .form-select {
            border-radius: 10px;
        }
        .btn-custom {
            border-radius: 25px;
            padding: 10px 30px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="col-md-6 col-lg-5">

        <!-- Messages -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <!-- Card -->
        <div class="card shadow-lg">
            <div class="card-body p-4">

                <h3 class="text-center mb-4 text-primary">
                    <i class="bi bi-person-plus-fill"></i> Student Details
                </h3>

                <form action="{% url 'student' %}" method="post">
                    {% csrf_token %}

                    <!-- Name -->
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" name="name" placeholder="Enter student name" required>
                        </div>
                    </div>

                    <!-- Age -->
                    <div class="mb-3">
                        <label class="form-label">Age</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-calendar"></i></span>
                            <input type="number" class="form-control" name="age" placeholder="Enter age" required>
                        </div>
                    </div>

                    <!-- Aadhar -->
                    <div class="mb-3">
                        <label class="form-label">Aadhar No</label>
                        <select class="form-select" name="aadhar" required>
                            <option value="">-- Select Aadhar No --</option>
                            {% for i in all_aadhar %}
                                <option value="{{ i.id }}">{{ i.aadhar_no }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Contact -->
                    <div class="mb-4">
                        <label class="form-label">Contact</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                            <input type="text" class="form-control" name="contact"
                                   placeholder="10 digit mobile number" maxlength="10" required>
                        </div>
                    </div>

                    <!-- Submit -->
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary btn-custom">
                            <i class="bi bi-save"></i> Save Student
                        </button>
                        <a href="{% url 'aadhar' %}" class="btn btn-outline-dark btn-custom">
                            <i class="bi bi-credit-card-2-front-fill"></i> Go to Aadhar</a>
                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
